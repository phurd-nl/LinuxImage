# Ubuntu 26.04 Desktop — autoinstall for LinuxEncryption golden images
#
# USB layout (NoCloud / OEM):
#   nocloud/
#     user-data          ← copy this file (or symlink)
#     meta-data          ← imaging/meta-data
#     extras/
#       linux-encryption-setup.tar.gz   ← built by imaging/build-imaging-seed.sh
#       late-install-linux-encryption.sh
#
# Requirements on target hardware:
#   - TPM 2.0, Secure Boot capable (user enables SB at first boot if needed)
#   - ≥50 GB unallocated free space AFTER install (this file leaves it at disk end)
#
# First boot: fullscreen LUKS password box → user enters login password → auto encrypt.

autoinstall:
  version: 1
  # Every answered section stays non-interactive. An empty list means
  # the installer must not stop on language, keyboard, disk, or account.
  interactive-sections: []

  # Refresh the installer snap from the stable channel.
  refresh-installer:
    update: false

  # Desktop minimal — adjust id per casper/install-sources.yaml on your ISO
  source:
    id: ubuntu-desktop-minimal
    search_drivers: false

  locale: en_US.UTF-8
  keyboard:
    layout: us

  # No network: section. This installer root is NFS. A network section makes
  # Subiquity run netplan apply, which stops NetworkManager. The root
  # filesystem is that NIC, so the installer deadlocks at
  # Drivers/_list_drivers/wait_apt and never reaches APT_CONFIGURED.
  # The live system keeps the DHCP address it already has. The first
  # late-command writes ethernet DHCP onto the installed disk.

  # CRITICAL: create uid-1000 user during install (wizard auto-detects this user).
  # Do NOT leave identity blank — GDM first-login wizard fights our encryption wizard.
  identity:
    hostname: ubuntu-laptop
    # uid 1000. The wizard binds LUKS keyslot 0 to this account.
    # Rename the account before the first-boot wizard runs, not after.
    username: nextadmin
    # imaging/build-imaging-seed.sh replaces this and writes
    # imaging/seed/TECH-PASSWORD.txt (mode 600). The user replaces it in the
    # wizard ("I was given a temporary password").
    password: "__TEMP_PASSWORD__"

  # Whole-disk encryption unlocked by the TPM (Ubuntu's TPM-backed FDE).
  # Needs Secure Boot on. The installer makes its own recovery key;
  # imaging-firstboot.sh files it with the imaging host.
  storage:
    layout:
      name: hybrid
      encrypted: yes

  # Pre-install packages the wizard and encryption pipeline need
  packages:
    - python3
    - curl
    - gdisk
    - cryptsetup
    - clevis
    - clevis-tpm2
    - tpm2-tools
    - mokutil
    - pamtester
    - timeshift
    - authd

  apt:
    geoip: false
    fallback: offline-install
  early-commands:
    - ["bash", "-c", "install -d /etc/apt/apt.conf.d; printf '%s\\n' 'Acquire::http::Timeout \"15\";' 'Acquire::https::Timeout \"15\";' 'Acquire::Retries \"0\";' > /etc/apt/apt.conf.d/99nextlink-timeout"]
  updates: security

  # Fetch the encryption files from the opsi host. USB is the backup.
  late-commands:
    - ["bash", "-c", "mkdir -p /target/etc/netplan && printf '%s\\n' 'network:' '  version: 2' '  renderer: NetworkManager' '  ethernets:' '    all-en:' '      match:' '        name: \"en*\"' '      dhcp4: true' '      optional: true' '    all-eth:' '      match:' '        name: \"eth*\"' '      dhcp4: true' '      optional: true' > /target/etc/netplan/90-nextlink-ethernet.yaml && chmod 600 /target/etc/netplan/90-nextlink-ethernet.yaml && rm -f /target/etc/netplan/00-installer-config.yaml"]
    - ["bash", "-c", "mkdir -p /target/opt"]
    - ["bash", "-c", "BASE=http://192.168.26.106:8090/nocloud/extras; get() { curl -fsSL \"$1\" -o \"$2\" 2>/dev/null || wget -q -O \"$2\" \"$1\"; }; if ! get \"$BASE/linux-encryption-setup.tar.gz\" /target/opt/linux-encryption-setup.tar.gz; then ART=''; for p in /cdrom/nocloud/extras/linux-encryption-setup.tar.gz /cdrom/extras/linux-encryption-setup.tar.gz /mnt/nocloud/extras/linux-encryption-setup.tar.gz; do [ -f \"$p\" ] && ART=\"$p\" && break; done; [ -n \"$ART\" ] || { echo 'Missing linux-encryption-setup.tar.gz'; exit 1; }; cp \"$ART\" /target/opt/linux-encryption-setup.tar.gz; fi"]
    - ["bash", "-c", "BASE=http://192.168.26.106:8090/nocloud/extras; get() { curl -fsSL \"$1\" -o \"$2\" 2>/dev/null || wget -q -O \"$2\" \"$1\"; }; if ! get \"$BASE/late-install-linux-encryption.sh\" /target/opt/late-install-linux-encryption.sh; then SCRIPT=''; for p in /cdrom/nocloud/extras/late-install-linux-encryption.sh /cdrom/extras/late-install-linux-encryption.sh; do [ -f \"$p\" ] && SCRIPT=\"$p\" && break; done; [ -n \"$SCRIPT\" ] || { echo 'Missing late-install-linux-encryption.sh'; exit 1; }; cp \"$SCRIPT\" /target/opt/late-install-linux-encryption.sh; fi; chmod 755 /target/opt/late-install-linux-encryption.sh"]
    - ["curtin", "in-target", "--", "bash", "/opt/late-install-linux-encryption.sh"]

  shutdown: reboot